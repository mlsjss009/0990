<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07030f;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #ffffff;
        background:
          radial-gradient(1400px 900px at 68% 35%, #2b1065 0%, rgba(43, 16, 101, 0) 62%),
          radial-gradient(1100px 700px at 92% 92%, #4a0f3d 0%, rgba(74, 15, 61, 0) 60%),
          linear-gradient(180deg, #08030f 0%, #120726 52%, #1b0630 100%);
      }
      #globe {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(7, 3, 15, 0.92) 0%,
          rgba(7, 3, 15, 0.72) 38%,
          rgba(7, 3, 15, 0.18) 68%,
          rgba(7, 3, 15, 0) 100%
        );
        pointer-events: none;
      }
      .ui {
        position: absolute;
        inset: 0;
        padding: 74px 110px 78px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
      .mark {
        width: 52px; height: 52px; border-radius: 16px;
        background: linear-gradient(135deg, #6366f1, #a855f7 55%, #ec4899);
        box-shadow: 0 16px 40px rgba(168, 85, 247, 0.45);
      }
      .since { font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(233, 213, 255, 0.7); font-weight: 600; }

      .mid { max-width: 1020px; }
      .headline { font-size: 86px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; }
      .headline .line { display: block; }
      .grad {
        background: linear-gradient(100deg, #a5b4fc, #c084fc 42%, #f472b6);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }

      .stats { display: flex; gap: 18px; margin-top: 44px; }
      .stat {
        border-radius: 22px;
        padding: 20px 26px;
        min-width: 220px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(196, 181, 253, 0.22);
        backdrop-filter: blur(18px);
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
      }
      .stat b {
        display: block;
        font-size: 44px;
        letter-spacing: -0.03em;
        font-weight: 800;
        background: linear-gradient(100deg, #c7d2fe, #d8b4fe 50%, #f9a8d4);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .stat span { display: block; margin-top: 4px; font-size: 19px; color: rgba(226, 232, 240, 0.78); font-weight: 500; }
      .stat.emerald b { background: linear-gradient(100deg, #6ee7b7, #5eead4); -webkit-background-clip: text; background-clip: text; }

      .cta {
        display: inline-flex; align-items: center; gap: 16px;
        padding: 26px 42px; border-radius: 999px;
        font-size: 32px; font-weight: 800; letter-spacing: -0.01em;
        color: #ffffff;
        background: linear-gradient(120deg, #6366f1, #a855f7 52%, #ec4899);
        box-shadow: 0 26px 70px rgba(147, 51, 234, 0.55);
      }
      .cta .dot { width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 9px rgba(255,255,255,.22); }
      .fineprint { margin-top: 22px; font-size: 23px; color: rgba(216, 180, 254, 0.78); }

      .flare {
        position: absolute; left: 26%; top: 300px; width: 1400px; height: 5px;
        background: linear-gradient(90deg, transparent, rgba(244, 114, 182, 0.9), transparent);
        filter: blur(8px); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <canvas
        id="globe"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        data-layout-allow-overflow="true"
      ></canvas>
      <div class="scrim clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div class="flare clip" id="flare" data-start="0" data-duration="6" data-track-index="1"></div>

      <div class="ui">
        <div class="top clip" id="top" data-start="0" data-duration="6" data-track-index="1">
          <div class="brand"><span class="mark"></span>Hope Together</div>
          <div class="since">Since 2010</div>
        </div>

        <div class="mid clip" id="mid" data-start="0" data-duration="6" data-track-index="1">
          <div class="headline">
            <span class="line" id="line1">Transforming</span>
            <span class="line grad" id="line2">Lives of Communities</span>
            <span class="line" id="line3">Around the World</span>
          </div>
          <div class="stats" id="stats">
            <div class="stat"><b id="v-lives">150K+</b><span>Lives Impacted</span></div>
            <div class="stat"><b id="v-programs">45</b><span>Active Programs</span></div>
            <div class="stat emerald"><b id="v-countries">25</b><span>Countries</span></div>
          </div>
        </div>

        <div class="clip" id="cta-wrap" data-start="0" data-duration="6" data-track-index="1">
          <div class="cta"><span class="dot"></span>Check Eligibility Now</div>
          <div class="fineprint">Essential resources. Real opportunities. Lasting change.</div>
        </div>
      </div>
    </div>

    <script type="module">
      import * as THREE from "./node_modules/three/build/three.module.js";

      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(20100601);

      const canvas = document.getElementById("globe");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.setClearColor(0x000000, 0);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 100);
      camera.position.set(0, 0, 16);

      const globe = new THREE.Group();
      globe.position.set(7.1, 0.2, 0);
      scene.add(globe);

      const RADIUS = 4.4;
      const COUNT = 5200;
      const positions = new Float32Array(COUNT * 3);
      const colors = new Float32Array(COUNT * 3);
      const cTop = new THREE.Color("#6366f1");
      const cMid = new THREE.Color("#a855f7");
      const cLow = new THREE.Color("#ec4899");

      for (let i = 0; i < COUNT; i++) {
        const theta = 2 * Math.PI * rand();
        const phi = Math.acos(2 * rand() - 1);
        const r = RADIUS * (0.97 + rand() * 0.07);
        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.cos(phi);
        const z = r * Math.sin(phi) * Math.sin(theta);
        positions.set([x, y, z], i * 3);

        const h = (y / RADIUS + 1) / 2;
        const color = h < 0.5 ? cTop.clone().lerp(cMid, h * 2) : cMid.clone().lerp(cLow, (h - 0.5) * 2);
        colors.set([color.r, color.g, color.b], i * 3);
      }

      const pointGeo = new THREE.BufferGeometry();
      pointGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      pointGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      const points = new THREE.Points(
        pointGeo,
        new THREE.PointsMaterial({
          size: 0.038,
          vertexColors: true,
          transparent: true,
          opacity: 0.95,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true,
        })
      );
      globe.add(points);

      const shell = new THREE.Mesh(
        new THREE.IcosahedronGeometry(RADIUS * 1.004, 2),
        new THREE.MeshBasicMaterial({ color: "#a78bfa", wireframe: true, transparent: true, opacity: 0.06 })
      );
      globe.add(shell);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(RADIUS * 1.26, 0.008, 8, 220),
        new THREE.MeshBasicMaterial({ color: "#f9a8d4", transparent: true, opacity: 0.35 })
      );
      ring.rotation.x = Math.PI / 2.35;
      globe.add(ring);

      const SHARDS = 34;
      const shards = new THREE.InstancedMesh(
        new THREE.TetrahedronGeometry(0.055),
        new THREE.MeshBasicMaterial({ color: "#e9d5ff", transparent: true, opacity: 0.85 }),
        SHARDS
      );
      const shardState = Array.from({ length: SHARDS }, () => ({
        radius: RADIUS * (1.14 + rand() * 0.5),
        speed: 0.1 + rand() * 0.25,
        phase: rand() * Math.PI * 2,
        tilt: (rand() - 0.5) * 1.5,
        spin: rand() * Math.PI,
      }));
      globe.add(shards);

      const STARS = 700;
      const starPositions = new Float32Array(STARS * 3);
      for (let i = 0; i < STARS; i++) {
        starPositions.set([(rand() - 0.5) * 34, (rand() - 0.5) * 22, -8 - rand() * 14], i * 3);
      }
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
      const stars = new THREE.Points(
        starGeo,
        new THREE.PointsMaterial({
          color: "#c4b5fd",
          size: 0.03,
          transparent: true,
          opacity: 0.5,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        })
      );
      scene.add(stars);

      const dummy = new THREE.Object3D();

      function drawAt(time) {
        const t = Math.max(0, Math.min(6, time));

        globe.rotation.y = 0.4 + t * 0.42;
        globe.rotation.x = Math.sin(t * 0.55) * 0.07;
        globe.scale.setScalar(0.94 + t * 0.012);

        shell.rotation.y = -t * 0.16;
        ring.rotation.z = t * 0.35;
        stars.rotation.y = t * 0.012;

        for (let i = 0; i < SHARDS; i++) {
          const s = shardState[i];
          const angle = t * s.speed + s.phase;
          dummy.position.set(
            Math.cos(angle) * s.radius,
            Math.sin(angle * 1.25) * s.radius * 0.5 * Math.cos(s.tilt),
            Math.sin(angle) * s.radius
          );
          dummy.rotation.set(angle * 1.6 + s.spin, angle * 1.2, s.spin);
          dummy.scale.setScalar(0.75 + Math.sin(t * 1.5 + s.phase) * 0.3);
          dummy.updateMatrix();
          shards.setMatrixAt(i, dummy.matrix);
        }
        shards.instanceMatrix.needsUpdate = true;

        camera.position.z = 16 - t * 0.32;
        camera.lookAt(3, 0.2, 0);
        renderer.render(scene, camera);
      }

      const counters = { lives: 0, programs: 0, countries: 0 };
      const livesEl = document.getElementById("v-lives");
      const programsEl = document.getElementById("v-programs");
      const countriesEl = document.getElementById("v-countries");

      const tl = gsap.timeline({ paused: true });

      tl.to({ v: 0 }, { v: 1, duration: 6, ease: "none", onUpdate: function () {
        drawAt(this.targets()[0].v * 6);
      } }, 0);

      tl.fromTo("#top", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.15);

      tl.fromTo("#line1", { opacity: 0, y: 60, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.85, ease: "power3.out" }, 0.55);
      tl.fromTo("#line2", { opacity: 0, y: 60, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.85, ease: "power3.out" }, 0.85);
      tl.fromTo("#line3", { opacity: 0, y: 60, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.85, ease: "power3.out" }, 1.15);

      tl.fromTo("#flare", { opacity: 0, x: -520 }, { opacity: 0.85, x: 0, duration: 0.5, ease: "power2.in" }, 2.15);
      tl.to("#flare", { opacity: 0, x: 620, duration: 0.55, ease: "power2.out" }, 2.65);

      tl.fromTo("#stats", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.5);
      tl.to(counters, { lives: 150, duration: 1.5, ease: "power2.out", onUpdate: () => { livesEl.textContent = `${Math.round(counters.lives)}K+`; } }, 2.55);
      tl.to(counters, { programs: 45, duration: 1.5, ease: "power2.out", onUpdate: () => { programsEl.textContent = `${Math.round(counters.programs)}`; } }, 2.65);
      tl.to(counters, { countries: 25, duration: 1.5, ease: "power2.out", onUpdate: () => { countriesEl.textContent = `${Math.round(counters.countries)}`; } }, 2.75);

      tl.fromTo("#cta-wrap", { opacity: 0, y: 48, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "back.out(1.5)" }, 4.35);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
      drawAt(0);
    </script>
  </body>
</html>
